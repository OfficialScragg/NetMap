{% extends "base.html" %}
{% block title %}Graph • NetMap{% endblock %}

{% block content %}
  <div class="graphViewport">
    <div id="graph" class="graph graph--viewport"></div>

    <div class="graphOverlay">
      <div class="graphOverlay__head">
        <div class="h2">Graph</div>
        <div class="muted small" id="graph-host-count">—</div>
      </div>

      <form id="graph-filters" class="graphOverlay__form">
        <div class="field">
          <label class="label" for="cluster">Cluster by</label>
          <select id="cluster" name="cluster">
            <option value="subnet" {% if (request.args.get('cluster') or 'subnet') == 'subnet' %}selected{% endif %}>Subnet</option>
            <option value="similarity" {% if (request.args.get('cluster') or 'subnet') == 'similarity' %}selected{% endif %}>Similarity (ports/services)</option>
          </select>
        </div>
        <div class="field">
          <label class="label" for="q">Search</label>
          <input id="q" name="q" value="{{ q }}" placeholder="ip, hostname, notes..." />
        </div>
        <div class="field">
          <label class="label" for="port">Open port</label>
          <input id="port" name="port" value="{{ port }}" inputmode="numeric" placeholder="e.g. 443" />
        </div>
        <div class="field">
          <label class="label" for="service">Service</label>
          <input id="service" name="service" value="{{ service }}" placeholder="e.g. http, ssh" />
        </div>
        <div class="field">
          <label class="label" for="subnet">Subnet</label>
          <input id="subnet" name="subnet" value="{{ subnet }}" placeholder="e.g. 192.168.0.0/24" />
        </div>
        <div class="field field--check">
          <label class="check">
            <input type="checkbox" name="hide_done" value="1" {% if hide_done %}checked{% endif %} />
            Hide inspected
          </label>
        </div>
        <div class="field">
          <label class="label" for="spacing">Spacing <span class="muted small" id="spacing-value"></span></label>
          <input id="spacing" type="range" min="0" max="100" value="55" />
        </div>
        <div class="field field--actions">
          <a class="btn btn--ghost" href="{{ url_for('graph') }}">Reset</a>
        </div>
      </form>
      <div class="muted small" style="margin-top:10px;">
        Hover for details • Click to open host
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
  <script src="{{ url_for('static', filename='graph.js') }}"></script>
  <script>
    const baseUrl = "{{ url_for('graph_data') }}";

    function currentQsFromForm() {
      const form = document.getElementById('graph-filters');
      const fd = new FormData(form);
      const qs = new URLSearchParams();
      for (const [k, v] of fd.entries()) {
        if (v === null || String(v).trim() === '') continue;
        qs.set(k, String(v));
      }
      return qs;
    }

    function applyUrlFromForm(push) {
      const qs = currentQsFromForm();
      const newUrl = window.location.pathname + (qs.toString() ? ('?' + qs.toString()) : '');
      if (push) history.pushState({}, '', newUrl);
      else history.replaceState({}, '', newUrl);
      return qs.toString();
    }

    function refreshGraph() {
      const qs = applyUrlFromForm(false);
      const url = baseUrl + (qs ? ('?' + qs) : '');
      window.NetMapGraph && window.NetMapGraph.refresh(url);
    }

    // Mount once
    window.NetMapGraph && window.NetMapGraph.mount({
      el: document.getElementById('graph'),
      url: baseUrl + (window.location.search || ''),
      onClick: function(node) {
        if (!node || !node.id) return;
        if (String(node.id).startsWith('cluster:')) return;
        window.location.href = "{{ url_for('host_detail', host_id=0) }}".replace("/0", "/" + node.id);
      }
    });

    // Wire filters (debounced)
    let t = null;
    document.getElementById('graph-filters').addEventListener('input', function () {
      // spacing is local-only; don't refresh backend data for it
      const active = document.activeElement;
      if (active && active.id === 'spacing') return;
      if (t) clearTimeout(t);
      t = setTimeout(refreshGraph, 250);
    });

    // Spacing slider -> live physics tuning
    const spacingEl = document.getElementById('spacing');
    const spacingValEl = document.getElementById('spacing-value');
    function updateSpacingLabel(v) {
      if (!spacingValEl) return;
      spacingValEl.textContent = '(' + v + ')';
    }
    if (spacingEl) {
      updateSpacingLabel(spacingEl.value);
      spacingEl.addEventListener('input', function () {
        updateSpacingLabel(spacingEl.value);
        window.NetMapGraph && window.NetMapGraph.setSpacing && window.NetMapGraph.setSpacing(parseInt(spacingEl.value, 10));
      });
      // apply initial spacing
      window.NetMapGraph && window.NetMapGraph.setSpacing && window.NetMapGraph.setSpacing(parseInt(spacingEl.value, 10));
    }
    // Make sure URL reflects initial server-side values
    applyUrlFromForm(false);
  </script>
{% endblock %}
